---

pvtNetworkFlags:
  removeGenesisOnDelete: true

cluster:
  provider: local  # choose from: local | aws | azure
  cloudNativeServices: false # set to true to use Cloud Native Services (SecretsManager and IAM for AWS; KeyVault & Managed Identities for Azure)

aws:
  serviceAccountName: besu-sa
  # the region you are deploying to
  region: ap-southeast-2

azure:
  serviceAccountName: besu-sa
  # the clientId of the user assigned managed identity created in the template
  identityClientId: azure-clientId
  keyvaultName: azure-keyvault
  # the tenant ID of the key vault
  tenantId: azure-tenantId
  # the subscription ID to use - this needs to be set explicitly when using multi tenancy
  subscriptionId: azure-subscriptionId

genesisConfig:
  # predefined: false  → generate genesis + validator keys (default)
  # predefined: true   → use the rawGenesisJson + validators supplied below
  predefined: false

  # validatorsAsBootnodes: true  → use the first 2 validators as bootnodes (default)
  # validatorsAsBootnodes: false → quorum-genesis-tool generates 2 dedicated bootnode keys
  validatorsAsBootnodes: true

  # --- Used when predefined: false ---
  # Parameters forwarded to the genesis tool
  genesis:
    config:
      chainId: 1337
      algorithm:
        consensus: qbft
        blockperiodseconds: 10
        epochlength: 30000
        requesttimeoutseconds: 20
    gasLimit: '0xf7b760'
    difficulty: '0x1'
    coinbase: '0x0000000000000000000000000000000000000000'
    maxCodeSize: 64000  # 64 KB
    txnSizeLimit: 64000  # 64 KB
  blockchain:
    nodes:
      generate: true
      count: 4
    accountPassword: 'password'

  # --- Used when predefined: true ---
  # Supply the raw genesis.json content and one entry per validator.
  # rawGenesisJson: |
  #   {
  #     "config": { ... },
  #     "nonce": "0x0",
  #     ...
  #   }
  rawGenesisJson: ""

  # validators:
  # - index: 1                       # explicit 1-based index — determines secret name besu-node-validator-<index>-keys
  #   nodekey: "3ee652..."           # hex-encoded private node key
  #   nodekeypub: "a1b2c3..."        # hex-encoded public node key (enode id)
  #   address: "0x1234..."           # node address derived from nodekey
  #   accountPrivateKey: "abcd..."   # account private key
  #   accountPassword: "password"
  #   accountKeystore: |             # keystore JSON
  #     { "version": 3, ... }
  #   accountAddress: "0x5678..."    # account address
  validators: []


image:
  repository: consensys/besu-k8s-hooks
  tag: "20260820"
  pullPolicy: IfNotPresent

tolerations: []

affinity: {}
