{{- if and (ne .Values.cluster.provider "local") (.Values.cluster.cloudNativeServices) }}
{{- /*
Keys are written to Key Vault / Secrets Manager by the pre-install hook, then synced by External Secrets Operator
into the <fullname>-keys Secret that the StatefulSet mounts. Only nodekey, nodekey.pub and enode are synced.
ESO must be installed on the cluster (see the repo README).
*/}}
{{- $storeName := .Values.externalSecrets.secretStoreRef.name | default (printf "%s-secret-store" (include "besu-node.fullname" .)) }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $storeName }}
    app.kubernetes.io/component: secretstore
    app.kubernetes.io/part-of: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "besu-node.chart" . }}
spec:
  provider:
{{- if eq .Values.cluster.provider "azure" }}
    # Workload identity: ESO requests a token for this service account, which must carry the
    # azure.workload.identity/client-id annotation and have a federated credential on the managed identity.
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://{{ .Values.azure.keyvaultName }}.vault.azure.net"
      tenantId: "{{ .Values.azure.tenantId }}"
      serviceAccountRef:
        name: {{ .Values.azure.serviceAccountName }}
{{- else if eq .Values.cluster.provider "aws" }}
    # IRSA: ESO assumes the role from this service account's eks.amazonaws.com/role-arn annotation.
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.aws.serviceAccountName }}
{{- end }}
{{- end }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "besu-node.fullname" . }}-keys
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "besu-node.fullname" . }}-keys
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/part-of: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "besu-node.chart" . }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ if .Values.externalSecrets.secretStoreRef.name }}{{ .Values.externalSecrets.secretStoreRef.kind }}{{ else }}SecretStore{{ end }}
  target:
    name: {{ include "besu-node.fullname" . }}-keys
    creationPolicy: Owner
  data:
{{- $fullname := include "besu-node.fullname" . }}
{{- /* besu only needs the node key pair; any other keys in the vault are ignored */}}
{{- range $secretKey, $remote := dict "nodekey" "nodekey" "nodekey.pub" "nodekeypub" "enode" "enode" }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $fullname }}-{{ $remote }}
{{- end }}
{{- end }}
