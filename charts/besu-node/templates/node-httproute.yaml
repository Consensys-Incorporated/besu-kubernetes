{{- if .Values.node.besu.rpc.httpRoute.enabled }}
{{- if not (or .Values.node.besu.rpc.enabled .Values.node.besu.ws.enabled) }}
{{- fail "node.besu.rpc.httpRoute.enabled requires node.besu.rpc.enabled or node.besu.ws.enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "besu-node.fullname" . }}-rpc
  labels:
    app.kubernetes.io/name: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/component: httproute
    app.kubernetes.io/part-of: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/namespace: {{ .Release.Namespace }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "besu-node.chart" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.node.besu.rpc.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.node.besu.rpc.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.node.besu.ws.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ .Values.node.besu.rpc.httpRoute.serviceName | default (include "besu-node.fullname" .) }}
          port: {{ .Values.node.besu.ws.port }}
          weight: 1
    {{- end }}
    {{- if .Values.node.besu.rpc.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.node.besu.rpc.httpRoute.serviceName | default (include "besu-node.fullname" .) }}
          port: {{ .Values.node.besu.rpc.port }}
          weight: 1
    {{- end }}
{{- end }}
