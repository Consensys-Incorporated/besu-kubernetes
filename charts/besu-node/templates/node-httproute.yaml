{{- if .Values.node.httpRoute.enabled }}
{{- if not (or .Values.node.besu.rpc.enabled .Values.node.besu.ws.enabled) }}
{{- fail "node.httpRoute.enabled needs node.besu.rpc.enabled or node.besu.ws.enabled" }}
{{- end }}
{{- if not .Values.node.httpRoute.parentRefs }}
{{- fail "node.httpRoute.enabled needs at least one entry in node.httpRoute.parentRefs" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "besu-node.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/component: httproute
    app.kubernetes.io/part-of: {{ include "besu-node.fullname" . }}
    app.kubernetes.io/namespace: {{ .Release.Namespace }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "besu-node.chart" . }}
  {{- with .Values.node.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- toYaml .Values.node.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.node.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.node.besu.ws.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ include "besu-node.fullname" . }}
          port: {{ .Values.node.besu.ws.port }}
    {{- end }}
    {{- if .Values.node.besu.rpc.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "besu-node.fullname" . }}
          port: {{ .Values.node.besu.rpc.port }}
    {{- end }}
{{- end }}
