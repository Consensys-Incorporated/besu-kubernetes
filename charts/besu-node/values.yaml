---

pvtNetworkFlags:
  # this will erase keys - so be careful with this on validators
  removeKeysOnDelete: false

cluster:
  provider: local  # choose from: local | aws | azure
  cloudNativeServices: false # set to true to use Cloud Native Services (SecretsManager and IAM for AWS; KeyVault & Managed Identities for Azure), synced via External Secrets
  reclaimPolicy: Delete # set to either Retain or Delete

aws:
  serviceAccountName: besu-sa
  # the region you are deploying to
  region: ap-southeast-2

azure:
  serviceAccountName: besu-sa
  # the clientId of the user assigned managed identity created in the template
  identityClientId: azure-clientId
  # the clientId of the user assigned managed identity in the node pool's resource group
  nodePoolIdentityClientId: azure-clientId
  keyvaultName: azure-keyvault
  # the tenant ID of the key vault
  tenantId: azure-tenantId
  # the subscription ID to use - this needs to be set explicitly when using multi tenancy
  subscriptionId: azure-subscriptionId

# Used when cluster.cloudNativeServices=true: the pre-install hook writes node keys to Key Vault / Secrets Manager,
# and External Secrets Operator (must be installed on the cluster) syncs them into the <fullname>-keys Secret.
externalSecrets:
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    # leave empty to have the chart create a namespaced SecretStore that authenticates as
    # azure.serviceAccountName (workload identity) or aws.serviceAccountName (IRSA).
    # Set to use an existing SecretStore / ClusterSecretStore instead.
    name: ""
    kind: SecretStore   # SecretStore | ClusterSecretStore

storage:
  sizeLimit: "20Gi"
  pvcSizeLimit: "20Gi"
  # NOTE: when you set this to Retain, the volume WILL persist after the chart is delete and you need to manually delete it
  reclaimPolicy: "Delete" # choose from: Delete | Retain
  aws:
    # Storage type to use when cluster.provider=aws.
    # gp3        — General Purpose SSD v3 (ebs.csi.aws.com). Default. Configurable IOPS/throughput.
    # io2        — Provisioned IOPS SSD v2 (ebs.csi.aws.com). High IOPS for demanding workloads.
    #              io2 Block Express supported on Nitro instances for up to 256,000 IOPS.
    # local-nvme — Host-local NVMe via hostPath (static PV). Requires i3/i3en/i4i instance family
    #              with instance store formatted and mounted at nvmePath before scheduling.
    diskType: gp3

    # IOPS — applies to gp3 (baseline 3000, max 16,000) and io2 (max 256,000).
    iops: "6000"

    # Throughput in MB/s — gp3 only (baseline 125, max 1,000). Ignored for io2 and local-nvme.
    throughput: "250"

    # nvmePath is only used when diskType=local-nvme.
    # Set to the mount point of the NVMe instance store on the node.
    nvmePath: /mnt/nvme
  azure:
    # Storage type to use when cluster.provider=azure.
    # azure-file    — Azure Files (file.csi.azure.com, Standard_LRS). Default, good for dev/test.
    # premium-ssd-v1 — Managed Premium SSD P-series (disk.csi.azure.com, Premium_LRS). Supports caching.
    # premium-ssd-v2 — Managed Premium SSD v2 (disk.csi.azure.com, PremiumV2_LRS). No caching. Higher IOPS ceiling.
    # ultra-disk    — Ultra Disk (disk.csi.azure.com, UltraSSD_LRS). No caching. Requires --enable-ultra-ssd on nodepool.
    # local-nvme    — Host-local NVMe via Azure Container Storage v2 (localdisk.csi.acstor.io). Requires the
    #                 Azure Container Storage extension on the cluster and a VM size with local NVMe (Lsv3/Lasv4).
    #                 Data is node-local: lost if the node is deleted/deallocated.
    diskType: azure-file

    # cachingMode applies to premium-ssd-v1 only.
    # Premium SSD v2 and Ultra Disk do not support host caching (must be None).
    # Options: None | ReadOnly | ReadWrite
    cachingMode: ReadOnly

# fixes permissions of volumes because besu runs as user `besu` and volumes prefer `root`
volumePermissionsFix:
  - local
  - aws

node:
  besu:
    envBesuOpts: ""
    resources:
      cpuLimit: 0.7
      cpuRequest: 0.5
      memLimit: "2G"
      memRequest: "1G"
    # privKey:
    # pubKey:
    dataPath: "/data/besu"
    keysPath: "/keys"
    privateKeyPath: "/keys/nodekey"
    genesisFilePath: "/etc/genesis/genesis.json"
    logging: INFO
    customLabels: {}
    identity: ""                   # optional human-readable node label (shown in admin_nodeInfo)
    syncMode: "FULL"               # FULL | FAST | SNAP | CHECKPOINT
    dataStorageFormat: "FOREST"    # FOREST | BONSAI
    minGasPrice: 0
    targetGasLimit: ""             # target block gas limit (empty = Besu default)
    revertReasonEnabled: true
    miner:
      enabled: false
      coinbase: "0x"
      extraData: ""
    txPool:
      type: "layered"              # layered | legacy
      priceBump: ""                # % bump required to replace a tx (empty = Besu default 10)
      maxFutureBySender: ""        # max queued future txs per sender (empty = Besu default)
      limitByAccountPercentage: "" # max fraction of pool a single account can use (empty = Besu default)
      maxSize: ""                  # max total tx pool size (empty = Besu default)
      retentionHours: ""           # hours to retain pending txs (legacy pool only, empty = Besu default)
    engine:
      enabled: false               # set true to enable Engine API (PoS / Merge)
      host: "0.0.0.0"
      rpcPort: 8551
      jwtDisabled: true            # disable JWT authentication on Engine API
      jwtSecret: ""                # path to JWT secret file (used when jwtDisabled=false)
      hostAllowlist: '["*"]'
    extraCLIArgs: []               # extra flags appended verbatim to the besu command
    account:
      password: 'password'
      passwordPath: "/keys/accountPassword"
    p2p:
      enabled: true
      host: ""                 # leave empty to use the pod IP; set explicitly to override (overridden automatically when externalDns.enabled=true)
      port: 30303
      discovery: true
      staticNodes: "/config/static/static-nodes.json"
      maxPeers: 25
      bootnodes: ""                # enode:// URL(s) for bootnodes outside the cluster (e.g. bare-metal VMs); if set, used directly instead of the besu-bootnodes ConfigMap
      staticNodesList: []          # inline static node enode:// URLs; if set, a ConfigMap is created from this list
    rpc:
      enabled: true
      host: "0.0.0.0"
      port: 8545
      api: '["DEBUG","ETH", "ADMIN", "WEB3", "IBFT", "NET", "TRACE", "QBFT", "PERM", "TXPOOL"]'
      corsOrigins: '["all"]'
      authenticationEnabled: false
      authCredentialsFile: ""      # path to credentials file (when authenticationEnabled=true)
      authJwtPublicKeyFile: ""     # path to JWT public key file (when authenticationEnabled=true)
      # Number of allowed active RPC connections for Besu node
      maxActiveConnections: 80
    ws:
      enabled: true
      host: "0.0.0.0"
      port: 8546
      api: '["DEBUG","ETH", "ADMIN", "WEB3", "IBFT", "NET", "TRACE", "QBFT", "PERM", "TXPOOL"]'
      authenticationEnabled: false
      authCredentialsFile: ""      # path to credentials file (when authenticationEnabled=true)
      authJwtPublicKeyFile: ""     # path to JWT public key file (when authenticationEnabled=true)
    graphql:
      enabled: false
      host: "0.0.0.0"
      port: 8547
      corsOrigins: '["all"]'
    http:
      allowlist: '["*"]'
    metrics:
      enabled: true
      host: "0.0.0.0"
      port: 9545
      # enable if using prometheus-stack metrics monitoring
      serviceMonitorEnabled: false      
    metricsPush:
      enabled: false
      host: "5.5.5.5"
      port: 9091
      interval: 15
      prometheusJob: "besu"
    permissions:
      enabled: false
      filePath: ""
      nodes:
        enabled: false
        allowlist: ["enode://abcd..@1.2.3.3:30303","enode://efba..@1.2.3.4:besu-node-bootnode-1-0.besu-node-bootnode-1.besu.svc.cluster.local:30303"]
      accounts:
        enabled: false
        allowlist: ["0x0000000000000000000000000000000000008888"]
      nodesContract:
        enabled: false
        address: "0x0000000000000000000000000000000000009999"
        version: 2
      accountsContract:
        enabled: false
        address: "0x0000000000000000000000000000000000008888"
  service:
    headless: true                # clusterIP: None; single-replica-per-release means ClusterIP's LB/VIP adds no value, just an extra NAT hop
  externalDns:
    enabled: false               # set true to add ExternalDNS hostname annotation to the service
    hostname: ""                 # DNS hostname to register (e.g. bootnode-a.besu.internal); also used as --p2p-host when set
    ttl: "60"                    # DNS record TTL in seconds; keep low so records update quickly after pod rescheduling

image:
  besu:
    repository: hyperledger/besu
    tag: 26.7.0
    pullPolicy: IfNotPresent
  hooks:
    repository: consensys/besu-k8s-hooks
    tag: "20260820"
    pullPolicy: IfNotPresent

tolerations: []

affinity: {}

