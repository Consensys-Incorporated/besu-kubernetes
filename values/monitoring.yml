---
# Values for prometheus-community/kube-prometheus-stack (tested against chart 88.5.2)
#
#   helm install monitoring prometheus-community/kube-prometheus-stack --version 88.5.2 \
#     --namespace monitoring --create-namespace --values ./values/monitoring.yml --wait
#
# The release MUST be named "monitoring": the besu-node chart labels its ServiceMonitors with
# `release: monitoring`, which is what Prometheus selects on below.
#
# Besu nodes need `node.besu.metrics.enabled: true` and `node.besu.metrics.serviceMonitorEnabled: true`
# (already set in values/validator.yml, values/rpc.yml etc.)

fullnameOverride: monitoring

prometheus:
  prometheusSpec:
    # Only pick up ServiceMonitors/PodMonitors/Rules labelled `release: monitoring` ...
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    # ... from the monitoring and besu namespaces only. The kubernetes.io/metadata.name label is
    # set automatically on every namespace (k8s >= 1.22). Add namespaces here as required.
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["monitoring", "besu"]
    podMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["monitoring", "besu"]
    ruleNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["monitoring", "besu"]

    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    # storageSpec:
    #   volumeClaimTemplate:
    #     spec:
    #       accessModes: ["ReadWriteOnce"]
    #       resources:
    #         requests:
    #           storage: 10Gi

