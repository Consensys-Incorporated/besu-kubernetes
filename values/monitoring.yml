grafana:
  # local dev only - change for anything shared
  adminUser: admin
  adminPassword: password
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: besu
          orgId: 1
          folder: Besu
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/besu
  dashboards:
    besu:
      # https://grafana.com/grafana/dashboards/10273-besu-overview/
      besu-overview:
        gnetId: 10273
        revision: 5
        datasource: Prometheus

